recovery_safe = "0x0000000000000000000000000000000000000000"
treasury_safe = "0x0000000000000000000000000000000000000000"
minter = "0x0000000000000000000000000000000000000000"
bot = "0x0000000000000000000000000000000000000000"

[minter]
allowance = 1000000000000

[protected]
extra = []
