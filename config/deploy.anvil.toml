# 로컬 Anvil 배포 입력값 (design.md 6장·10장 테스트넷 값).
# Anvil에는 Safe가 없으므로 Anvil 기본 계정(니모닉 "test ... junk")이 Safe 자리를 대신한다.
# 인덱스: 0 배포자, 1 거버넌스, 2 운영, 3 회수, 4 금고, 5 발행(minter), 6 봇.
# 실제 체인에서는 require_contract_holders = true로 Safe 주소(코드가 있는 주소)만 받는다.

[checks]
expected_chain_id = 31337
require_contract_holders = false

[token]
name = "Stable Token"
symbol = "STB"
min_freeze_age = 600 # 10분

[timelock]
min_delay = 600 # 10분

[holders]
governance_safe = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
ops_safe = "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
recovery_safe = "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
treasury_safe = "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
minter = "0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc"
bot = "0x976EA74026E726554dB657fA54763abd0C3a0aa9"

[minter]
allowance = 1000000000000 # 1,000,000 STB (소수점 6)

[protected]
# 타임락, 토큰, 각 Safe, minter는 스크립트가 자동으로 보호 주소로 지정한다. 여기에는 그 외 주소만 둔다.
extra = []
